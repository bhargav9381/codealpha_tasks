<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Gallery</h1>
        <p>Explore beautiful moments through images</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
    </div>

    <!-- Gallery -->
    <main class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80"
                 alt="Beautiful mountain">
            <div class="overlay">
                <h3>Mountain View</h3>
                <p>Nature</p>
            </div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
                 alt="Forest">
            <div class="overlay">
                <h3>Green Forest</h3>
                <p>Nature</p>
            </div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=900&q=80"
                 alt="City skyline">
            <div class="overlay">
                <h3>City Skyline</h3>
                <p>City</p>
            </div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=900&q=80"
                 alt="Modern city">
            <div class="overlay">
                <h3>Modern City</h3>
                <p>City</p>
            </div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1546182990-dffeafbe841d?auto=format&fit=crop&w=900&q=80"
                 alt="Lion">
            <div class="overlay">
                <h3>Wild Lion</h3>
                <p>Animals</p>
            </div>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552728089-57bdde30beb3?auto=format&fit=crop&w=900&q=80"
                 alt="Colorful bird">
            <div class="overlay">
                <h3>Beautiful Bird</h3>
                <p>Animals</p>
            </div>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=900&q=80"
                 alt="Mountain landscape">
            <div class="overlay">
                <h3>Mountain Landscape</h3>
                <p>Nature</p>
            </div>
        </div>

        <div class="gallery-item" data-category="city">
            <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=900&q=80"
                 alt="City at night">
            <div class="overlay">
                <h3>City Lights</h3>
                <p>City</p>
            </div>
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="closeBtn">&times;</button>

        <button class="navigation prev" id="prevBtn">&#10094;</button>

        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Gallery image">

            <div class="image-info">
                <h2 id="imageTitle"></h2>
                <p id="imageCategory"></p>
            </div>
        </div>

        <button class="navigation next" id="nextBtn">&#10095;</button>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Image Gallery | CodeAlpha Task</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
